name = "cloudflare-relation-net"
main = "worker/index.ts"
compatibility_date = "2026-05-18"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 把 wrangler d1 create 返回的 database_id 填到下面（一键按钮会自动填）
[[d1_databases]]
binding = "DB"
database_name = "relation-net-db"
database_id = "PLACEHOLDER_REPLACE_AFTER_WRANGLER_D1_CREATE"
migrations_dir = "migrations"
